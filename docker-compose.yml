services:
  jiskra:
    build: .
    container_name: jiskra
    env_file: .env
    volumes:
      - ../jiskra-data:/data
    networks:
      - shared
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Joins the network owned by the overtime-tool stack, so its nginx can reach
# http://jiskra:4777. No ports are published here - all traffic goes through nginx.
# The overtime-tool stack must have been (re)deployed first so that this network exists.
networks:
  shared:
    external: true
    name: shared-internal
