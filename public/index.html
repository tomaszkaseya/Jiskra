<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jiskra</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1b2430; --muted:#6b7684; --border:#dde2e8;
  --accent:#2563eb; --accent-soft:#e8effd;
  --green:#15803d; --green-soft:#e5f5ec;
  --yellow:#a16207; --yellow-soft:#fdf3d7;
  --red:#b91c1c; --red-soft:#fdeaea;
  --gray-soft:#eef0f3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13161b; --card:#1c2128; --text:#e6e9ee; --muted:#96a0ac; --border:#323a45;
    --accent:#6ba0ff; --accent-soft:#1d2d4d;
    --green:#5fd08a; --green-soft:#17301f;
    --yellow:#e8c45a; --yellow-soft:#39301300;
    --yellow-soft:#393013; --red:#f08a8a; --red-soft:#3d1a1a;
    --gray-soft:#262c34;
  }
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.3px}
header h1 span{color:var(--accent)}
.tabs{display:flex;gap:4px}
.tab{padding:7px 18px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text);cursor:pointer;font-size:14px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.toolbar{margin-left:auto;display:flex;gap:10px;align-items:center}
select,input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font:inherit}
button.primary{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit}
button.ghost{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
button.ghost:hover{color:var(--text)}
main{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
.summary{color:var(--muted);margin:4px 0 16px}
.epic{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.epic-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;flex-wrap:wrap}
.epic-head:hover{background:var(--gray-soft)}
.key{font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.epic-title{font-weight:600;flex:1;min-width:200px}
.badge{padding:2px 9px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--gray-soft);color:var(--muted)}
.badge.q{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.cat-done{background:var(--green-soft);color:var(--green)}
.badge.cat-indeterminate{background:var(--yellow-soft);color:var(--yellow)}
.badge.cat-new{background:var(--gray-soft);color:var(--muted)}
.badge.risk-open{background:var(--red-soft);color:var(--red);font-weight:600}
.rag{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--border)}
.rag-green{background:#22a858;border-color:#22a858}
.rag-amber{background:#eab308;border-color:#eab308}
.rag-red{background:#dc2626;border-color:#dc2626}
.rag-grey{background:#9aa3ad;border-color:#9aa3ad}
.epic-body{border-top:1px solid var(--border);padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:800px){.epic-body{grid-template-columns:1fr}}
h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.entry{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--bg)}
.entry .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .meta .spacer{margin-left:auto}
.risk-sev{font-weight:700}
.sev-High{color:var(--red)} .sev-Medium{color:var(--yellow)} .sev-Low{color:var(--green)}
.risk.closed{opacity:.55}
.risk.closed .risk-title{text-decoration:line-through}
.mitigation{margin-top:6px;padding:6px 8px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:13px}
.risk-updates{margin-top:8px;padding-left:10px;border-left:2px solid var(--border)}
.risk-updates h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.rupd{font-size:13px;margin-bottom:4px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.rupd .d{color:var(--muted);white-space:nowrap;font-size:12px}
.rupd .t{flex:1;min-width:150px}
form.rupd-add{display:flex;gap:6px;margin-top:4px}
form.rupd-add input[type=date]{width:130px}
form.rupd-add input[name=text]{flex:1}
form.add{display:grid;gap:6px;margin-top:10px}
form.add .row{display:flex;gap:6px}
form.add .row > *{flex:1}
textarea{resize:vertical;min-height:38px}
.empty{color:var(--muted);font-style:italic;font-size:13px}
.loading{text-align:center;color:var(--muted);padding:40px}
.error{background:var(--red-soft);color:var(--red);padding:12px 16px;border-radius:8px;margin-bottom:14px;white-space:pre-wrap}
.proj-head{margin:22px 0 10px;font-size:15px;font-weight:700;color:var(--muted)}
.viewtoggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.viewtoggle button{border:none;background:none;color:var(--muted);padding:6px 12px;cursor:pointer;font:inherit}
.viewtoggle button.active{background:var(--accent);color:#fff}
table.matrix{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.matrix th,.matrix td{border-bottom:1px solid var(--border);padding:8px 12px;text-align:left;vertical-align:middle}
.matrix thead th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--gray-soft)}
.matrix th.qcol,.matrix td.qcell{width:170px;border-left:1px solid var(--border)}
.matrix tbody tr.epic-row{cursor:pointer}
.matrix tbody tr.epic-row:hover{background:var(--gray-soft)}
.matrix td.namecell{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.matrix tr.proj-row td{font-weight:700;color:var(--muted);background:var(--gray-soft);font-size:13px}
.matrix tr.detail-row > td{padding:0;background:var(--bg)}
.matrix tr.detail-row .epic-body{border-top:none}
.pbar{display:flex;align-items:center;gap:8px}
.pbar .track{display:block;flex:1;height:9px;border-radius:5px;background:var(--gray-soft);border:1px solid var(--border);overflow:hidden}
.pbar .fill{display:block;height:100%;background:var(--green)}
.pbar .num{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.matrix tfoot td{font-weight:600;background:var(--gray-soft)}
body[data-page=settings] .tabs, body[data-page=settings] .toolbar > :not(#settingsBtn){display:none}
#settingsBtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.settings{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
@media (max-width:700px){.settings{grid-template-columns:1fr}}
.snav{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.snav button{display:block;width:100%;text-align:left;padding:11px 16px;border:none;background:none;color:var(--text);cursor:pointer;font:inherit;border-bottom:1px solid var(--border)}
.snav button:last-child{border-bottom:none}
.snav button.active{background:var(--accent);color:#fff;font-weight:600}
.snav button:disabled{color:var(--muted);cursor:default;font-style:italic}
.spanel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px}
.spanel h2{margin:0 0 4px;font-size:17px}
.spanel .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
table.users{width:100%;border-collapse:collapse;margin-bottom:18px}
.users th,.users td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left}
.users th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.users td.actions{text-align:right;white-space:nowrap}
.users td.actions button{margin-left:6px}
form.adduser{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:start}
@media (max-width:700px){form.adduser{grid-template-columns:1fr}}
.msg{font-size:13px;min-height:18px;margin-top:8px}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.inlinepw{display:flex;gap:6px;margin-top:6px}
.inlinepw input{flex:1}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:20}
#login form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;display:grid;gap:10px;width:300px}
#login h2{margin:0 0 6px;font-size:18px}
#login .error-msg{color:var(--red);font-size:13px;min-height:18px}
</style>
</head>
<body>
<header>
  <h1>Jiskra <span>✦</span></h1>
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <div class="viewtoggle" id="viewToggle">
      <button data-view="table">Table</button>
      <button data-view="list">List</button>
    </div>
    <select id="quarterFilter"><option value="">All quarters</option></select>
    <select id="riskFilter">
      <option value="">All epics</option>
      <option value="open-risks">With open risks</option>
    </select>
    <button class="ghost" id="report">⬇ Report</button>
    <button class="ghost" id="refresh">↻ Refresh</button>
    <button class="ghost" id="settingsBtn" title="Settings">⚙</button>
  </div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div id="content" class="loading">Loading…</div>
</main>
<div id="login">
  <form id="loginForm">
    <h2>Jiskra <span style="color:var(--accent)">✦</span></h2>
    <input name="username" placeholder="Username" autocomplete="username" required>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <div class="error-msg" id="loginError"></div>
    <button class="primary">Sign in</button>
  </form>
</div>

<script>
let CFG = null, GATE = null, EPICS = [], OPEN = new Set(), PAGE = "board";
let VIEW = localStorage.getItem("view") || "table";
let EDITING = null; // "status:<id>" | "risk:<id>"

const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);

async function api(path, opts = {}){
  const token = localStorage.getItem("token");
  if(token){
    opts.headers = Object.assign({}, opts.headers, { Authorization: "Bearer " + token });
  }
  const r = await fetch(path, opts);
  if(r.status === 401 && path !== "/api/login"){
    localStorage.removeItem("token");
    showLogin();
    throw new Error("unauthorized");
  }
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || r.status);
  return j;
}

// --- pages ---
function setPage(page, fromHash){
  PAGE = page;
  document.body.dataset.page = page;
  $("#settingsBtn").classList.toggle("active", page === "settings");
  if(!fromHash) location.hash = page === "settings" ? "#settings" : "";
  if(page === "settings"){
    $("#summary").textContent = "Settings";
    renderSettings();
  }else{
    load();
  }
}

// --- settings ---
let SETTINGS_SECTION = "users";
let RESET_USER = null; // username whose inline password-reset row is open

function renderSettings(){
  $("#content").className = "";
  $("#content").innerHTML = `<div class="settings">
    <nav class="snav">
      <button class="${SETTINGS_SECTION==="users"?"active":""}" data-section="users">Users</button>
      <button disabled title="Coming soon">Jira connection</button>
      <button disabled title="Coming soon">Gates &amp; projects</button>
    </nav>
    <div class="spanel" id="spanel"></div>
  </div>`;
  $("#content").querySelectorAll("[data-section]").forEach(b => b.onclick = () => {
    SETTINGS_SECTION = b.dataset.section; renderSettings();
  });
  renderUsersSection();
}

async function renderUsersSection(){
  const panel = $("#spanel");
  panel.innerHTML = `<h2>Users</h2>
    <p class="hint">Everyone listed here can sign in and manage users — Jiskra has no roles.</p>
    <div id="usersTable" class="loading">Loading…</div>
    <h2 style="margin-top:6px;font-size:14px">Add user</h2>
    <form class="adduser" id="userForm">
      <input name="username" placeholder="Username" autocomplete="off" required>
      <input name="password" type="password" placeholder="Password (min 8 chars)" minlength="8" required>
      <button class="primary">Add</button>
    </form>
    <div class="msg" id="userMsg"></div>`;
  $("#userForm").onsubmit = saveUser;
  try{
    const d = await api("/api/users");
    const me = (localStorage.getItem("username")||"");
    $("#usersTable").innerHTML = `<table class="users">
      <thead><tr><th>Username</th><th></th></tr></thead>
      <tbody>${d.users.map(u => `<tr>
        <td>${esc(u)}${u===me?' <span class="badge">you</span>':""}
          ${RESET_USER===u?`<form class="inlinepw" data-reset-user="${esc(u)}">
            <input name="password" type="password" placeholder="New password (min 8 chars)" minlength="8" required autofocus>
            <button class="primary">Set</button>
            <button type="button" class="ghost" data-cancel-reset>Cancel</button>
          </form>`:""}
        </td>
        <td class="actions">
          <button class="ghost" data-reset="${esc(u)}">Reset password</button>
          <button class="ghost" data-del-user="${esc(u)}">Delete</button>
        </td>
      </tr>`).join("")}</tbody>
    </table>`;
    bindUserEvents();
  }catch(e){
    $("#usersTable").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function bindUserEvents(){
  const t = $("#usersTable");
  t.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
    RESET_USER = RESET_USER === b.dataset.reset ? null : b.dataset.reset;
    renderUsersSection();
  });
  t.querySelectorAll("[data-cancel-reset]").forEach(b => b.onclick = () => {
    RESET_USER = null; renderUsersSection();
  });
  t.querySelectorAll("form[data-reset-user]").forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    try{
      await api("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:f.dataset.resetUser, password:new FormData(f).get("password")})});
      RESET_USER = null;
      await renderUsersSection();
      setUserMsg(`Password updated for '${f.dataset.resetUser}'.`, true);
    }catch(e){ setUserMsg(e.message, false); }
  });
  t.querySelectorAll("[data-del-user]").forEach(b => b.onclick = async () => {
    if(!confirm(`Delete user '${b.dataset.delUser}'?`)) return;
    try{
      await api("/api/users/"+encodeURIComponent(b.dataset.delUser), {method:"DELETE"});
      await renderUsersSection();
      setUserMsg("User deleted.", true);
    }catch(e){ setUserMsg(e.message, false); }
  });
}

function setUserMsg(text, ok){
  const m = $("#userMsg");
  if(!m) return;
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
}

async function saveUser(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  try{
    const d = await api("/api/users", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username: fd.get("username"), password: fd.get("password")})});
    await renderUsersSection();
    setUserMsg(d.updated ? `Password updated for '${d.username}'.` : `User '${d.username}' created.`, true);
  }catch(e){ setUserMsg(e.message, false); }
}

function showLogin(){
  $("#login").style.display = "flex";
  $("#loginForm").onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    try{
      const d = await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:fd.get("username"),password:fd.get("password")})});
      if(d.token) localStorage.setItem("token", d.token);
      if(d.username) localStorage.setItem("username", d.username);
      $("#login").style.display = "none";
      $("#loginError").textContent = "";
      await init();
    }catch(e){
      $("#loginError").textContent = "Invalid username or password";
    }
  };
}

async function init(){
  CFG = await api("/api/config");
  GATE = localStorage.getItem("gate") || String(CFG.gates[0]);
  if(!CFG.gates.map(String).includes(GATE)) GATE = String(CFG.gates[0]);
  renderTabs();
  renderViewToggle();
  $("#refresh").onclick = load;
  $("#report").onclick = downloadReport;
  $("#settingsBtn").onclick = () => setPage(PAGE === "settings" ? "board" : "settings");
  window.onhashchange = () => setPage(location.hash === "#settings" ? "settings" : "board", true);
  if(location.hash === "#settings") { setPage("settings", true); return; }
  $("#quarterFilter").onchange = render;
  $("#riskFilter").onchange = render;
  await load();
}

function renderViewToggle(){
  const t = $("#viewToggle");
  t.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.dataset.view === VIEW);
    b.onclick = () => { VIEW = b.dataset.view; localStorage.setItem("view", VIEW); renderViewToggle(); render(); };
  });
}

function renderTabs(){
  $("#tabs").innerHTML = CFG.gates.map(g =>
    `<button class="tab ${String(g)===GATE?"active":""}" data-g="${g}" title="${esc((CFG.gateDescriptions||{})[g]||"")}">Gate ${g}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => {
    GATE = b.dataset.g; localStorage.setItem("gate", GATE); renderTabs(); load();
  });
}

async function load(){
  $("#content").innerHTML = '<div class="loading">Loading Gate '+esc(GATE)+' epics from Jira…</div>';
  try{
    const d = await api("/api/epics?gate="+encodeURIComponent(GATE));
    EPICS = d.epics;
    const quarters = [...new Set(EPICS.map(e=>e.targetQuarter).filter(Boolean))].sort();
    const qf = $("#quarterFilter"); const cur = qf.value;
    qf.innerHTML = '<option value="">All quarters</option>' + quarters.map(q=>`<option ${q===cur?"selected":""}>${esc(q)}</option>`).join("");
    render();
  }catch(e){
    $("#content").innerHTML = '<div class="error">Failed to load from Jira: '+esc(e.message)+'</div>';
  }
}

function openRisks(e){ return e.risks.filter(r=>r.status==="open"); }

function render(){
  const q = $("#quarterFilter").value, rf = $("#riskFilter").value;
  let list = EPICS;
  if(q) list = list.filter(e=>e.targetQuarter===q);
  if(rf==="open-risks") list = list.filter(e=>openRisks(e).length);
  const totalOpen = list.reduce((n,e)=>n+openRisks(e).length,0);
  const gdesc = (CFG.gateDescriptions||{})[GATE];
  $("#summary").textContent = `Gate ${GATE}${gdesc?` (${gdesc})`:""} · ${list.length} epic${list.length===1?"":"s"} · ${totalOpen} open risk${totalOpen===1?"":"s"}`;
  if(!list.length){ $("#content").innerHTML = '<div class="empty">No epics match.</div>'; return; }

  if(VIEW === "table"){
    $("#content").innerHTML = matrixHtml(list);
  }else{
    const byProj = {};
    list.forEach(e => (byProj[e.project] ??= []).push(e));
    $("#content").innerHTML = Object.keys(byProj).sort().map(p =>
      `<div class="proj-head">${esc(p)}</div>` + byProj[p].map(epicHtml).join("")
    ).join("");
  }
  bindEvents();
}

function ragHtml(rag){
  if(!rag) return `<span class="rag rag-grey" title="RAG: not set (not started)"></span>`;
  const cls = /green/i.test(rag) ? "rag-green" : /amber|yellow/i.test(rag) ? "rag-amber" : /red/i.test(rag) ? "rag-red" : "rag-grey";
  return `<span class="rag ${cls}" title="RAG: ${esc(rag)}"></span>`;
}

function pbarHtml(p){
  if(!p || !p.total) return '<span class="pbar"><span class="num">–</span></span>';
  const pct = Math.round(100*p.done/p.total);
  return `<span class="pbar" title="${p.done} / ${p.total} issues done"><span class="track"><span class="fill" style="width:${pct}%"></span></span><span class="num">${pct}%</span></span>`;
}

function matrixHtml(list){
  const quarters = [...new Set(list.map(e=>e.targetQuarter).filter(Boolean))].sort();
  const noQ = list.some(e=>!e.targetQuarter);
  const cols = noQ ? [...quarters, null] : quarters;
  const byProj = {};
  list.forEach(e => (byProj[e.project] ??= []).push(e));
  const colSpan = cols.length + 1;

  const rows = Object.keys(byProj).sort().map(p =>
    `<tr class="proj-row"><td colspan="${colSpan}">${esc(p)}</td></tr>` +
    byProj[p].map(e => {
      const risks = openRisks(e);
      const cells = cols.map(q =>
        `<td class="qcell">${(e.targetQuarter||null)===q ? pbarHtml(e.progress) : ""}</td>`).join("");
      const detail = OPEN.has(e.key)
        ? `<tr class="detail-row epic" data-key="${e.key}"><td colspan="${colSpan}">${epicBody(e)}</td></tr>` : "";
      return `<tr class="epic-row epic" data-key="${e.key}" data-toggle="${e.key}">
        <td class="namecell">
          ${ragHtml(e.rag)}
          <a class="key" href="${esc(e.url)}" target="_blank" onclick="event.stopPropagation()">${e.key}</a>
          <span>${esc(e.summary)}</span>
          <span class="badge cat-${esc(e.statusCategory)}">${esc(e.status)}</span>
          ${risks.length?`<span class="badge risk-open">⚠ ${risks.length}</span>`:""}
        </td>${cells}</tr>` + detail;
    }).join("")
  ).join("");

  const totals = cols.map(q => {
    const inQ = list.filter(e => (e.targetQuarter||null)===q);
    const agg = inQ.reduce((a,e)=>({done:a.done+e.progress.done,total:a.total+e.progress.total}),{done:0,total:0});
    return `<td class="qcell">${pbarHtml(agg)}</td>`;
  }).join("");

  return `<table class="matrix">
    <thead><tr><th>Epic</th>${cols.map(q=>`<th class="qcol">${q?esc(q):"No quarter"}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Total</td>${totals}</tr></tfoot>
  </table>`;
}

function epicHtml(e){
  const open = OPEN.has(e.key);
  const risks = openRisks(e);
  const lastStatus = e.statuses[0];
  return `<div class="epic" data-key="${e.key}">
    <div class="epic-head" data-toggle="${e.key}">
      ${ragHtml(e.rag)}
      <a class="key" href="${esc(e.url)}" target="_blank" onclick="event.stopPropagation()">${e.key}</a>
      <span class="epic-title">${esc(e.summary)}</span>
      ${e.progress && e.progress.total?`<span style="min-width:110px">${pbarHtml(e.progress)}</span>`:""}
      ${e.targetQuarter?`<span class="badge q">${esc(e.targetQuarter)}</span>`:""}
      <span class="badge cat-${esc(e.statusCategory)}">${esc(e.status)}</span>
      ${risks.length?`<span class="badge risk-open">⚠ ${risks.length} risk${risks.length===1?"":"s"}</span>`:""}
      ${lastStatus?`<span class="badge" title="${esc(lastStatus.text)}">last update ${esc(lastStatus.date)}</span>`:""}
    </div>
    ${open?epicBody(e):""}
  </div>`;
}

function epicBody(e){
  return `<div class="epic-body">
    <section>
      <h3>Daily status</h3>
      ${e.statuses.length ? e.statuses.map(s => statusEntryHtml(e,s)).join("") : '<div class="empty">No status updates yet.</div>'}
      <form class="add" data-add-status="${e.key}">
        <div class="row"><input type="date" name="date" value="${today()}" required><input name="author" placeholder="Who reported (optional)"></div>
        <textarea name="text" placeholder="Status for today…" required></textarea>
        <div class="row"><button class="primary">Add status</button></div>
      </form>
    </section>
    <section>
      <h3>Risks</h3>
      ${e.risks.length ? e.risks.map(r=>riskHtml(e,r)).join("") : '<div class="empty">No risks. 🎉</div>'}
      <form class="add" data-add-risk="${e.key}">
        <input name="title" placeholder="Risk title" required>
        <textarea name="description" placeholder="Description / impact"></textarea>
        <textarea name="mitigation" placeholder="Mitigation plan"></textarea>
        <div class="row">
          <select name="severity"><option>High</option><option selected>Medium</option><option>Low</option></select>
          <input name="owner" placeholder="Owner">
        </div>
        <div class="row"><button class="primary">Add risk</button></div>
      </form>
    </section>
  </div>`;
}

function statusEntryHtml(e,s){
  if(EDITING === "status:"+s.id){
    return `<form class="entry add" data-edit-status="${s.id}" data-epic="${e.key}">
      <div class="row"><input type="date" name="date" value="${esc(s.date)}" required><input name="author" value="${esc(s.author||"")}" placeholder="Who reported (optional)"></div>
      <textarea name="text" required>${esc(s.text)}</textarea>
      <div class="row"><button class="primary">Save</button><button type="button" class="ghost" data-cancel-edit>Cancel</button></div>
    </form>`;
  }
  return `<div class="entry">
    <div class="meta"><strong>${esc(s.date)}</strong>${s.author?` · ${esc(s.author)}`:""}
      <span class="spacer"></span>
      <button class="ghost" data-edit="status:${s.id}">✎</button>
      <button class="ghost" data-del-status="${s.id}">✕</button></div>
    <div>${esc(s.text)}</div>
  </div>`;
}

function riskHtml(e,r){
  if(EDITING === "risk:"+r.id){
    const sev = s => s===r.severity ? "selected" : "";
    return `<form class="entry add" data-edit-risk="${r.id}" data-epic="${e.key}">
      <input name="title" value="${esc(r.title)}" required>
      <textarea name="description" placeholder="Description / impact">${esc(r.description||"")}</textarea>
      <textarea name="mitigation" placeholder="Mitigation plan">${esc(r.mitigation||"")}</textarea>
      <div class="row">
        <select name="severity"><option ${sev("High")}>High</option><option ${sev("Medium")}>Medium</option><option ${sev("Low")}>Low</option></select>
        <input name="owner" value="${esc(r.owner||"")}" placeholder="Owner">
      </div>
      <div class="row"><button class="primary">Save</button><button type="button" class="ghost" data-cancel-edit>Cancel</button></div>
    </form>`;
  }
  const closed = r.status!=="open";
  return `<div class="entry risk ${closed?"closed":""}">
    <div class="meta">
      <span class="risk-sev sev-${esc(r.severity)}">${esc(r.severity)}</span>
      <strong class="risk-title">${esc(r.title)}</strong>
      ${r.owner?`· ${esc(r.owner)}`:""}
      <span class="spacer"></span>
      <span>${esc((r.createdAt||"").slice(0,10))}${r.closedAt?` → closed ${esc(r.closedAt.slice(0,10))}`:""}</span>
      <button class="ghost" data-edit="risk:${r.id}">✎</button>
      <button class="ghost" data-risk-toggle="${r.id}" data-epic="${e.key}">${closed?"Reopen":"Close"}</button>
      <button class="ghost" data-del-risk="${r.id}" data-epic="${e.key}">✕</button>
    </div>
    ${r.description?`<div>${esc(r.description)}</div>`:""}
    ${r.mitigation?`<div class="mitigation"><strong>Mitigation:</strong> ${esc(r.mitigation)}</div>`:""}
    <div class="risk-updates">
      ${(r.updates||[]).length?`<h4>Updates</h4>`:""}
      ${(r.updates||[]).map(u => riskUpdateHtml(e,r,u)).join("")}
      <form class="rupd-add" data-add-rupd="${r.id}" data-epic="${e.key}">
        <input type="date" name="date" value="${today()}" required>
        <input name="text" placeholder="Update on this risk…" required>
        <button class="ghost">Add</button>
      </form>
    </div>
  </div>`;
}

function riskUpdateHtml(e,r,u){
  if(EDITING === "rupd:"+u.id){
    return `<form class="rupd-add" data-edit-rupd="${u.id}" data-risk="${r.id}" data-epic="${e.key}">
      <input type="date" name="date" value="${esc(u.date)}" required>
      <input name="text" value="${esc(u.text)}" required>
      <button class="ghost">Save</button>
      <button type="button" class="ghost" data-cancel-edit>Cancel</button>
    </form>`;
  }
  return `<div class="rupd">
    <span class="d">${esc(u.date)}</span>
    <span class="t">${esc(u.text)}${u.author?` <span class="d">· ${esc(u.author)}</span>`:""}</span>
    <button class="ghost" data-edit="rupd:${u.id}">✎</button>
    <button class="ghost" data-del-rupd="${u.id}" data-risk="${r.id}" data-epic="${e.key}">✕</button>
  </div>`;
}

function bindEvents(){
  document.querySelectorAll("[data-toggle]").forEach(h => h.onclick = () => {
    const k = h.dataset.toggle;
    OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k);
    render();
  });
  document.querySelectorAll("form[data-add-status]").forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    const key = f.dataset.addStatus, fd = new FormData(f);
    await api(`/api/epic/${key}/status`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date:fd.get("date"),author:fd.get("author"),text:fd.get("text")})});
    await reloadLocal(key);
  });
  document.querySelectorAll("form[data-add-risk]").forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    const key = f.dataset.addRisk, fd = new FormData(f);
    await api(`/api/epic/${key}/risk`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({title:fd.get("title"),description:fd.get("description"),mitigation:fd.get("mitigation"),severity:fd.get("severity"),owner:fd.get("owner"),status:"open"})});
    await reloadLocal(key);
  });
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    EDITING = b.dataset.edit;
    render();
  });
  document.querySelectorAll("[data-cancel-edit]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    EDITING = null;
    render();
  });
  document.querySelectorAll("form[data-edit-status]").forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    await api(`/api/epic/${f.dataset.epic}/status/${f.dataset.editStatus}`,{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date:fd.get("date"),author:fd.get("author"),text:fd.get("text")})});
    EDITING = null;
    await reloadLocal(f.dataset.epic);
  });
  document.querySelectorAll("form[data-edit-risk]").forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    await api(`/api/epic/${f.dataset.epic}/risk/${f.dataset.editRisk}`,{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({title:fd.get("title"),description:fd.get("description"),mitigation:fd.get("mitigation"),severity:fd.get("severity"),owner:fd.get("owner")})});
    EDITING = null;
    await reloadLocal(f.dataset.epic);
  });
  document.querySelectorAll("form[data-add-rupd]").forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    await api(`/api/epic/${f.dataset.epic}/risk/${f.dataset.addRupd}/update`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date:fd.get("date"),text:fd.get("text")})});
    await reloadLocal(f.dataset.epic);
  });
  document.querySelectorAll("form[data-edit-rupd]").forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    await api(`/api/epic/${f.dataset.epic}/risk/${f.dataset.risk}/update/${f.dataset.editRupd}`,{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date:fd.get("date"),text:fd.get("text")})});
    EDITING = null;
    await reloadLocal(f.dataset.epic);
  });
  document.querySelectorAll("[data-del-rupd]").forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    if(!confirm("Delete this risk update?")) return;
    await api(`/api/epic/${b.dataset.epic}/risk/${b.dataset.risk}/update/${b.dataset.delRupd}`,{method:"DELETE"});
    await reloadLocal(b.dataset.epic);
  });
  document.querySelectorAll("[data-del-status]").forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    if(!confirm("Delete this status entry?")) return;
    const key = b.closest(".epic").dataset.key;
    await api(`/api/epic/${key}/status/${b.dataset.delStatus}`,{method:"DELETE"});
    await reloadLocal(key);
  });
  document.querySelectorAll("[data-del-risk]").forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    if(!confirm("Delete this risk?")) return;
    await api(`/api/epic/${b.dataset.epic}/risk/${b.dataset.delRisk}`,{method:"DELETE"});
    await reloadLocal(b.dataset.epic);
  });
  document.querySelectorAll("[data-risk-toggle]").forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    const key = b.dataset.epic;
    const epic = EPICS.find(x=>x.key===key);
    const risk = epic.risks.find(x=>x.id===b.dataset.riskToggle);
    await api(`/api/epic/${key}/risk/${risk.id}`,{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status: risk.status==="open" ? "closed" : "open"})});
    await reloadLocal(key);
  });
}

// --- Executive report: one standalone HTML file covering all gates ---
async function downloadReport(){
  const btn = $("#report");
  btn.disabled = true; btn.textContent = "⏳ Report…";
  try{
    const sections = [];
    for(const g of CFG.gates){
      const d = await api("/api/epics?gate="+encodeURIComponent(g));
      sections.push({ gate: String(g), list: d.epics });
    }
    const html = reportHtml(sections);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], {type:"text/html"}));
    a.download = `jiskra-report-${today()}.html`;
    a.click();
    URL.revokeObjectURL(a.href);
  }finally{
    btn.disabled = false; btn.textContent = "⬇ Report";
  }
}

const ragColor = r => !r ? "#9aa3ad" : /green/i.test(r) ? "#22a858" : /amber|yellow/i.test(r) ? "#eab308" : /red/i.test(r) ? "#dc2626" : "#9aa3ad";

function gateSectionHtml(gate, list){
  const gdesc = (CFG.gateDescriptions||{})[gate] || "";
  const agg = list.reduce((a,e)=>({done:a.done+e.progress.done,total:a.total+e.progress.total}),{done:0,total:0});
  const pct = agg.total ? Math.round(100*agg.done/agg.total) : 0;
  const allOpen = list.flatMap(e => openRisks(e).map(r => ({epic:e, risk:r})));
  const sevRank = {High:0, Medium:1, Low:2};
  allOpen.sort((a,b)=>(sevRank[a.risk.severity]??3)-(sevRank[b.risk.severity]??3));
  const sevCount = s => allOpen.filter(x=>x.risk.severity===s).length;

  const rows = list.map(e => {
    const p = e.progress.total ? Math.round(100*e.progress.done/e.progress.total) : null;
    const last = e.statuses[0];
    return `<tr>
      <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${ragColor(e.rag)};margin-right:6px"></span>
          <a href="${esc(e.url)}">${e.key}</a> ${esc(e.summary)}</td>
      <td>${esc(e.targetQuarter||"—")}</td>
      <td>${esc(e.status)}</td>
      <td style="text-align:right">${p===null?"—":p+"% ("+e.progress.done+"/"+e.progress.total+")"}</td>
      <td style="text-align:center">${openRisks(e).length||"—"}</td>
      <td>${last?esc(last.date)+": "+esc(last.text):"—"}</td>
    </tr>`;
  }).join("");

  const riskRows = allOpen.map(({epic,risk}) => {
    const lastUpd = (risk.updates||[])[0];
    const sevColor = risk.severity==="High"?"#dc2626":risk.severity==="Medium"?"#b45309":"#15803d";
    return `<tr>
      <td style="color:${sevColor};font-weight:700">${esc(risk.severity)}</td>
      <td><a href="${esc(epic.url)}">${epic.key}</a></td>
      <td><strong>${esc(risk.title)}</strong>${risk.description?"<br>"+esc(risk.description):""}</td>
      <td>${esc(risk.mitigation||"—")}</td>
      <td>${esc(risk.owner||"—")}</td>
      <td>${lastUpd?esc(lastUpd.date)+": "+esc(lastUpd.text):"—"}</td>
    </tr>`;
  }).join("");

  return `<section class="gate">
<h1>Gate ${esc(gate)}</h1>
<div class="sub">${esc(gdesc)}</div>
<div class="kpis">
  <div class="kpi"><div class="n">${list.length}</div><div class="l">Epics</div></div>
  <div class="kpi"><div class="n">${pct}%</div><div class="l">Issues done (${agg.done}/${agg.total})</div></div>
  <div class="kpi"><div class="n" style="color:#dc2626">${sevCount("High")}</div><div class="l">High risks open</div></div>
  <div class="kpi"><div class="n" style="color:#b45309">${sevCount("Medium")}</div><div class="l">Medium risks open</div></div>
  <div class="kpi"><div class="n" style="color:#15803d">${sevCount("Low")}</div><div class="l">Low risks open</div></div>
</div>
<h2>Epics</h2>
<table><thead><tr><th>Epic (RAG)</th><th>Quarter</th><th>Jira status</th><th>Progress</th><th>Open risks</th><th>Latest status note</th></tr></thead>
<tbody>${rows}</tbody></table>
${allOpen.length ? `<h2>Open risks</h2>
<table><thead><tr><th>Severity</th><th>Epic</th><th>Risk</th><th>Mitigation plan</th><th>Owner</th><th>Latest update</th></tr></thead>
<tbody>${riskRows}</tbody></table>` : "<h2>Open risks</h2><p>No open risks. 🎉</p>"}
</section>`;
}

// Refresh one epic's local data without re-hitting Jira for the whole gate.
async function reloadLocal(key){
  const d = await api("/api/epics?gate="+encodeURIComponent(GATE));
  const fresh = d.epics.find(x=>x.key===key);
  const idx = EPICS.findIndex(x=>x.key===key);
  if(fresh && idx>-1){ EPICS[idx].statuses = fresh.statuses; EPICS[idx].risks = fresh.risks; }
  render();
}
