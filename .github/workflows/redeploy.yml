name: Redeploy Jiskra

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  redeploy:
    runs-on: [self-hosted, net-internal]
    steps:
      - name: Call internal redeploy webhook
        shell: powershell
        run: |
          curl.exe -v --fail -m 20 `
            -X POST "http://10.60.1.144:9001/hooks/redeploy-jiskra" `
            -H "Content-Type: application/x-www-form-urlencoded" `
            --data "token=${{ secrets.REDEPLOY_TOKEN }}" `
            -w "`nHTTP %{http_code}`n"
